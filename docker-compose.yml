services:
  postgres:
    image: postgres:17-alpine
    container_name: isp-inventory-db
    environment:
      POSTGRES_USER: isp
      POSTGRES_PASSWORD: isp_password
      POSTGRES_DB: isp_inventory
    ports:
      # só na loopback: em dev o Postgres não precisa (nem pode) ser alcançável
      # da rede, e a senha do compose é pública no repositório
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isp -d isp_inventory"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
